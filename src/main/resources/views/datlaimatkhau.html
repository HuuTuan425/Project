<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title>Đặt lại mật khẩu</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="auth-page auth-reset-page">
    <main class="auth-container">
        <section class="auth-content">
            <div class="auth-heading">
                <div class="reset-security-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 3 5 6v5c0 4.7 2.9 8.4 7 10 4.1-1.6 7-5.3 7-10V6l-7-3Z"/>
                        <path d="m9.2 12 1.8 1.8 3.8-4"/>
                    </svg>
                </div>
                <span class="auth-eyebrow">BẢO MẬT TÀI KHOẢN</span>
                <h1>Đặt lại mật khẩu</h1>
                <p>Chọn mật khẩu mới có ít nhất 8 ký tự.</p>
            </div>
            <p th:if="${resetError}" class="message error" th:text="${resetError}" role="alert"></p>
            <form th:action="@{/dat-lai-mat-khau}" th:object="${resetForm}" method="post" class="auth-form">
                <input type="hidden" th:field="*{token}">
                <small class="field-error" th:errors="*{token}"></small>
                <div class="form-group">
                    <label for="password">Mật khẩu mới</label>
                    <div class="auth-input-wrap">
                        <input id="password" type="password" th:field="*{password}"
                               placeholder="Nhập mật khẩu mới"
                               autocomplete="new-password" minlength="8" maxlength="64" required autofocus>
                        <button type="button" class="password-toggle" data-target="password" aria-label="Hiện mật khẩu">
                            <svg class="eye-off" viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"/>
                                <circle cx="12" cy="12" r="2.5"/>
                                <path d="M3 3l18 18"/>
                            </svg>
                            <svg class="eye-open" viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"/>
                                <circle cx="12" cy="12" r="2.5"/>
                            </svg>
                        </button>
                    </div>
                    <small class="field-error" th:errors="*{password}"></small>
                    <div class="password-strength" aria-live="polite">
                        <div class="strength-bars" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
                        <span class="strength-label">Nhập ít nhất 8 ký tự</span>
                    </div>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Xác nhận mật khẩu mới</label>
                    <div class="auth-input-wrap">
                        <input id="confirmPassword" type="password" th:field="*{confirmPassword}"
                               placeholder="Nhập lại mật khẩu mới"
                               autocomplete="new-password" minlength="8" maxlength="64" required>
                        <button type="button" class="password-toggle" data-target="confirmPassword" aria-label="Hiện mật khẩu xác nhận">
                            <svg class="eye-off" viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"/>
                                <circle cx="12" cy="12" r="2.5"/>
                                <path d="M3 3l18 18"/>
                            </svg>
                            <svg class="eye-open" viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"/>
                                <circle cx="12" cy="12" r="2.5"/>
                            </svg>
                        </button>
                    </div>
                    <small class="field-error" th:errors="*{confirmPassword}"></small>
                    <span class="password-match" aria-live="polite"></span>
                </div>
                <button type="submit" class="btn btn-primary auth-submit" disabled>
                    <span>Lưu mật khẩu mới</span>
                    <span aria-hidden="true">→</span>
                </button>
            </form>
            <p class="auth-footer"><a th:href="@{/dang-nhap}"><span aria-hidden="true">←</span> Quay lại đăng nhập</a></p>
        </section>
    </main>
    <script>
        const passwordInput = document.getElementById('password');
        const confirmInput = document.getElementById('confirmPassword');
        const strengthLabel = document.querySelector('.strength-label');
        const strengthBars = document.querySelectorAll('.strength-bars span');
        const matchLabel = document.querySelector('.password-match');
        const submitButton = document.querySelector('.auth-submit');

        document.querySelectorAll('.password-toggle').forEach((button) => {
            button.addEventListener('click', () => {
                const input = document.getElementById(button.dataset.target);
                const showPassword = input.type === 'password';
                input.type = showPassword ? 'text' : 'password';
                button.classList.toggle('is-visible', showPassword);
                button.setAttribute('aria-label', showPassword ? 'Ẩn mật khẩu' : 'Hiện mật khẩu');
            });
        });

        passwordInput.addEventListener('input', () => {
            const value = passwordInput.value;
            let strength = 0;
            if (value.length >= 8) strength++;
            if (/[A-Z]/.test(value) && /[a-z]/.test(value)) strength++;
            if (/\d/.test(value)) strength++;
            if (/[^A-Za-z0-9]/.test(value) && value.length >= 12) strength++;

            strengthBars.forEach((bar, index) => bar.classList.toggle('active', index < strength));
            const labels = ['Nhập ít nhất 8 ký tự', 'Mật khẩu yếu', 'Mật khẩu khá', 'Mật khẩu tốt', 'Mật khẩu mạnh'];
            const labelIndex = value ? Math.max(1, strength) : 0;
            strengthLabel.textContent = labels[labelIndex];
            strengthLabel.dataset.level = String(labelIndex);
            updateMatch();
        });

        confirmInput.addEventListener('input', updateMatch);

        function updateMatch() {
            const confirmValue = confirmInput.value;
            matchLabel.className = 'password-match';
            if (!confirmValue) {
                matchLabel.textContent = '';
            } else if (confirmValue === passwordInput.value) {
                matchLabel.textContent = 'Mật khẩu khớp';
                matchLabel.classList.add('matched');
            } else {
                matchLabel.textContent = 'Mật khẩu chưa khớp';
                matchLabel.classList.add('not-matched');
            }
            submitButton.disabled =
                passwordInput.value.length < 8 ||
                confirmInput.value.length < 8 ||
                confirmInput.value !== passwordInput.value;
        }

        updateMatch();
    </script>
</body>
</html>
