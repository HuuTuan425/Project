<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{khachhang/layout :: head('Khách hàng')}"></head>
<body>
    <div th:replace="~{khachhang/layout :: page(~{::section})}">
        <section>
            <div class="customer-form-header">
                <h2 th:text="${khachHang.maKhachHang != null} ? 'Sửa khách hàng' : 'Thêm khách hàng mới'"></h2>
                <a class="customer-back-link" th:href="${fromSale} ? @{/hoa-don/lap} : @{/khach-hang}">
                    <span aria-hidden="true">←</span> Quay lại danh sách
                </a>
            </div>

            <form th:action="${khachHang.maKhachHang != null} ? @{/khach-hang/sua} : @{/khach-hang/them}"
                  th:object="${khachHang}" method="post" class="customer-form">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                
                <!-- Bắt buộc phải có để lưu mã khi sửa -->
                <input type="hidden" th:field="*{maKhachHang}">
                <input type="hidden" name="fromSale" th:value="${fromSale}">

                <div class="customer-form-grid">
                    <div class="form-group">
                        <label for="hoTen">Họ và tên <span class="required-mark">*</span></label>
                        <input id="hoTen" type="text" th:field="*{hoTen}" placeholder="Nhập họ và tên khách hàng" required>
                    </div>

                    <div class="form-group">
                        <label for="soDienThoai">Số điện thoại <span class="required-mark">*</span></label>
                        <input id="soDienThoai" type="tel" th:field="*{soDienThoai}" placeholder="Ví dụ: 0912345678" required>
                    </div>

                    <div class="form-group">
                        <label for="soCMND">CMND/CCCD</label>
                        <input id="soCMND" type="text" th:field="*{soCMND}" placeholder="Nhập số CMND hoặc CCCD">
                    </div>

                    <div class="form-group">
                        <label for="ngaySinh">Ngày sinh</label>
                        <input id="ngaySinh" type="date" th:field="*{ngaySinh}">
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input id="email" type="email" th:field="*{email}" placeholder="example@gmail.com">
                    </div>

                    <div class="form-group">
                        <label for="loaiKhachHang">Loại khách hàng</label>
                        <select id="loaiKhachHang" th:field="*{loaiKhachHang}">
                            <option th:each="loai : ${loaiKhachHangs}" th:value="${loai}" th:text="${loai.displayName}"></option>
                        </select>
                    </div>

                    <div class="form-group customer-address-field">
                        <label for="diaChi">Địa chỉ</label>
                        <input id="diaChi" type="text" th:field="*{diaChi}" placeholder="Nhập địa chỉ khách hàng">
                    </div>

                    <div class="form-group">
                        <label for="diemThuong">Điểm thưởng</label>
                        <input id="diemThuong" type="number" th:field="*{diemThuong}" value="0" readonly>
                    </div>
                </div>

                <div class="customer-form-actions">
                    <button type="submit" class="btn btn-success">Lưu khách hàng</button>
                    <a class="btn btn-secondary" th:href="${fromSale} ? @{/hoa-don/lap} : @{/khach-hang}">Hủy</a>
                </div>
            </form>
        </section>
    </div>
</body>
</html>
