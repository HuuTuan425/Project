<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{khachhang/layout :: head('Khách hàng')}"></head>
<body>
    <div th:replace="~{khachhang/layout :: page(~{::section})}">
        <section>
            <h2 th:text="${khachHang.maKhachHang != null} ? 'Sửa khách hàng' : 'Thêm khách hàng mới'"></h2>
            
            <form th:action="${khachHang.maKhachHang != null} ? @{/khach-hang/sua} : @{/khach-hang/them}"
                  th:object="${khachHang}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                
                <!-- Bắt buộc phải có để lưu mã khi sửa -->
                <input type="hidden" th:field="*{maKhachHang}">
                <input type="hidden" name="fromSale" th:value="${fromSale}">

                <div class="form-group">
                    <label>Họ và tên:</label>
                    <input type="text" th:field="*{hoTen}" required>
                </div>
                
                <div class="form-group">
                    <label>CMND/CCCD:</label>
                    <input type="text" th:field="*{soCMND}" required>
                </div>

                <div class="form-group">
                    <label>Ngày sinh:</label>
                    <input type="date" th:field="*{ngaySinh}">
                </div>

                <div class="form-group">
                    <label>Số điện thoại:</label>
                    <input type="text" th:field="*{soDienThoai}">
                </div>

                <div class="form-group">
                    <label>Email:</label>
                    <input type="email" th:field="*{email}">
                </div>

                <div class="form-group">
                    <label>Địa chỉ:</label>
                    <input type="text" th:field="*{diaChi}">
                </div>

                <div class="form-group">
                    <label>Loại khách hàng:</label>
                    <select th:field="*{loaiKhachHang}">
                        <option th:each="loai : ${loaiKhachHangs}" th:value="${loai}" th:text="${loai}"></option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Điểm thưởng:</label>
                    <input type="number" th:field="*{diemThuong}" value="0" readonly>
                </div>

                <button type="submit" class="btn btn-success">Lưu</button>
                <a th:href="${fromSale} ? @{/hoa-don/lap} : @{/khach-hang}" style="margin-left: 10px;">Hủy</a>
            </form>
        </section>
    </div>
</body>
</html>
