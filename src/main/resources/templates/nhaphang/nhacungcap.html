<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{khachhang/layout :: head('Nhà cung cấp')}"></head>
<body>
    <div th:replace="~{khachhang/layout :: page(~{::section})}">
        <section>
            <div class="page-heading">
                <div>
                    <h1>Nhà cung cấp</h1>
                </div>
            </div>
            <p th:if="${successMessage}" class="message success" th:text="${successMessage}"></p>
            <p th:if="${errorMessage}" class="message error" th:text="${errorMessage}"></p>
            <form th:action="@{/nhap-hang/nha-cung-cap}" th:object="${supplierForm}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <input type="hidden" th:field="*{id}">
                <div class="supplier-form-grid">
                    <div class="form-group">
                        <label for="name">Tên nhà cung cấp</label>
                        <input id="name" type="text" th:field="*{name}" maxlength="150"
                               placeholder="Nhập tên nhà cung cấp..." autocomplete="organization" required>
                        <small class="field-error" th:errors="*{name}"></small>
                    </div>
                    <div class="form-group">
                        <label for="phone">Số điện thoại</label>
                        <input id="phone" type="tel" th:field="*{phone}" maxlength="30"
                               placeholder="Ví dụ: 0981 234 567" autocomplete="tel">
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input id="email" type="email" th:field="*{email}" maxlength="150"
                               placeholder="Ví dụ: lienhe@nhacungcap.vn" autocomplete="email">
                    </div>
                    <div class="form-group">
                        <label for="address">Địa chỉ</label>
                        <input id="address" type="text" th:field="*{address}" maxlength="255"
                               placeholder="Nhập địa chỉ nhà cung cấp..." autocomplete="street-address">
                    </div>
                </div>
                <div class="supplier-actions">
                    <button type="submit" class="btn btn-success">
                        <span th:if="*{id == null}" aria-hidden="true">＋&nbsp;</span>
                        <span th:text="*{id == null} ? 'Thêm nhà cung cấp' : 'Lưu thay đổi'"></span>
                    </button>
                    <a th:if="*{id != null}" th:href="@{/nhap-hang/nha-cung-cap}"
                       class="btn btn-secondary">Hủy sửa</a>
                </div>
            </form>

            <details class="supplier-list-panel">
                <summary>
                    <span>Danh sách nhà cung cấp</span>
                    <span class="account-list-count"
                          th:text="${#lists.size(suppliers) + ' nhà cung cấp'}"></span>
                </summary>
                <div class="supplier-table-scroll">
                    <table class="table-bordered align-middle">
                        <thead>
                            <tr>
                                <th scope="col">Tên</th>
                                <th scope="col">Số điện thoại</th>
                                <th scope="col">Email</th>
                                <th scope="col">Địa chỉ</th>
                                <th scope="col" class="table-actions">Thao tác</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="supplier : ${suppliers}">
                                <td th:text="${supplier.name}"></td>
                                <td th:text="${#strings.isEmpty(supplier.phone) ? '-' : supplier.phone}"></td>
                                <td th:text="${#strings.isEmpty(supplier.email) ? '-' : supplier.email}"></td>
                                <td th:text="${#strings.isEmpty(supplier.address) ? '-' : supplier.address}"></td>
                                <td class="table-actions">
                                    <div class="supplier-actions">
                                        <a class="btn btn-outline-primary"
                                           th:href="@{/nhap-hang/nha-cung-cap/{id}/sua(id=${supplier.id})}">Sửa</a>
                                        <form class="supplier-action-form"
                                              th:action="@{/nhap-hang/nha-cung-cap/{id}/xoa(id=${supplier.id})}"
                                              method="post"
                                              onsubmit="return confirm('Bạn có chắc muốn xóa nhà cung cấp này?')">
                                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                            <button type="submit" class="btn btn-outline-danger">Xóa</button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(suppliers)}">
                                <td colspan="5" class="supplier-empty">Chưa có nhà cung cấp.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </details>
        </section>
    </div>
</body>
</html>
