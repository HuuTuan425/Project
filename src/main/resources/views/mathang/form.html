<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{khachhang/layout :: head('Thông tin mặt hàng')}"></head>
<body>
    <div th:replace="~{khachhang/layout :: page(~{::section})}">
        <section>
            <div class="customer-form-header">
                <h2 th:text="${matHang.maMatHang == null ? 'Thêm mặt hàng' : 'Sửa mặt hàng'}"></h2>
                <a class="customer-back-link" th:href="@{/mat-hang}">
                    <span aria-hidden="true">←</span> Quay lại danh sách
                </a>
            </div>
            <form th:action="${matHang.maMatHang == null ? '/mat-hang/them' : '/mat-hang/sua/' + matHang.maMatHang}"
                  th:object="${matHang}" method="post" class="customer-form product-form">
                <input type="hidden" th:field="*{maMatHang}">
                <div th:if="${#fields.hasGlobalErrors()}" class="message error" th:each="error : ${#fields.globalErrors()}" th:text="${error}"></div>
                <div class="customer-form-grid product-form-grid">
                    <div class="form-group">
                        <label for="tenMatHang">Tên mặt hàng <span class="required-mark">*</span></label>
                        <input id="tenMatHang" type="text" th:field="*{tenMatHang}" placeholder="Nhập tên mặt hàng" required>
                        <small class="field-error" th:errors="*{tenMatHang}"></small>
                    </div>
                    <div class="form-group">
                        <label for="loaiMatHang">Loại mặt hàng <span class="required-mark">*</span></label>
                        <select id="loaiMatHang" th:field="*{loaiMatHang}" required>
                            <option value="">-- Chọn loại --</option>
                            <option th:each="loai : ${loaiMatHangs}" th:value="${loai}" th:text="${loai.displayName}"></option>
                        </select>
                        <small class="field-error" th:errors="*{loaiMatHang}"></small>
                    </div>
                    <div class="form-group">
                        <label for="hangSanXuat">Hãng sản xuất</label>
                        <input id="hangSanXuat" type="text" th:field="*{hangSanXuat}" placeholder="Nhập hãng sản xuất">
                    </div>
                    <div class="form-group">
                        <label for="giaBanGoc">Giá bán <span class="required-mark">*</span></label>
                        <input id="giaBanGoc" type="number" step="0.01" min="0.01" th:field="*{giaBanGoc}" placeholder="Ví dụ: 25000" required>
                        <small class="field-error" th:errors="*{giaBanGoc}"></small>
                    </div>
                    <div class="form-group">
                        <label for="giaKhuyenMai">Giá khuyến mãi</label>
                        <input id="giaKhuyenMai" type="number" step="0.01" min="0.01" th:field="*{giaKhuyenMai}" placeholder="Để trống nếu không có">
                        <small class="field-error" th:errors="*{giaKhuyenMai}"></small>
                    </div>
                    <div class="form-group">
                        <label for="ngaySanXuat">Ngày sản xuất</label>
                        <input id="ngaySanXuat" type="date" th:field="*{ngaySanXuat}">
                    </div>
                    <div class="form-group">
                        <label for="thoiGianBatDauKM">Bắt đầu khuyến mãi</label>
                        <input id="thoiGianBatDauKM" type="datetime-local" th:field="*{thoiGianBatDauKM}">
                    </div>
                    <div class="form-group">
                        <label for="thoiGianKetThucKM">Kết thúc khuyến mãi</label>
                        <input id="thoiGianKetThucKM" type="datetime-local" th:field="*{thoiGianKetThucKM}">
                        <small class="field-error" th:errors="*{thoiGianKetThucKM}"></small>
                    </div>
                    <div class="form-group">
                        <label for="hanSuDung">Hạn sử dụng</label>
                        <input id="hanSuDung" type="date" th:field="*{hanSuDung}">
                    </div>
                    <div class="form-group product-stock-field">
                        <label>Số lượng tồn</label>
                        <div class="product-stock-value" th:text="${matHang.quantityInStock != null ? matHang.quantityInStock : 0}">0</div>
                    </div>
                </div>
                <p class="product-stock-note">Tồn kho chỉ tăng khi xác nhận nhận phiếu nhập.</p>
                <div class="customer-form-actions">
                    <button type="submit" class="btn btn-success">Lưu mặt hàng</button>
                    <a th:href="@{/mat-hang}" class="btn btn-secondary">Hủy</a>
                </div>
            </form>
        </section>
    </div>
</body>
</html>
