<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{khachhang/layout :: head('Tạo phiếu nhập')}"></head>
<body>
    <div th:replace="~{khachhang/layout :: page(~{::section})}">
        <section>
            <div class="page-heading purchase-page-heading">
                <div>
                    <h1>Tạo phiếu nhập kho</h1>
                </div>
            </div>
            <p>Phiếu nhập ở trạng thái chờ nhận sẽ chưa làm tăng tồn kho.</p>
            <p th:if="${errorMessage}" class="message error" th:text="${errorMessage}"></p>
            <p th:if="${#lists.isEmpty(suppliers)}" class="message error">
                Chưa có nhà cung cấp. <a th:href="@{/nhap-hang/nha-cung-cap}">Thêm nhà cung cấp</a> trước.
            </p>
            <form th:action="@{/nhap-hang}" th:object="${purchaseOrderForm}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div class="form-group">
                    <label for="supplierId">Nhà cung cấp</label>
                    <select id="supplierId" th:field="*{supplierId}" required>
                        <option value="">-- Chọn nhà cung cấp --</option>
                        <option th:each="supplier : ${suppliers}" th:value="${supplier.id}" th:text="${supplier.name}"></option>
                    </select>
                </div>
                <div id="purchase-lines">
                    <div class="purchase-line form-group" th:each="line, row : *{lines}">
                        <label>Mặt hàng</label>
                        <select th:field="*{lines[__${row.index}__].productId}">
                            <option value="">-- Chọn mặt hàng --</option>
                            <option th:each="mh : ${matHangs}" th:value="${mh.maMatHang}" th:text="${mh.tenMatHang}"></option>
                        </select>
                        <label>Số lượng</label>
                        <input type="number" min="1" th:field="*{lines[__${row.index}__].quantity}">
                        <label>Giá nhập mỗi sản phẩm</label>
                        <input type="number" min="0.01" step="0.01" th:field="*{lines[__${row.index}__].unitCost}">
                        <label>Ngày sản xuất (nếu có)</label>
                        <input type="date" th:field="*{lines[__${row.index}__].manufactureDate}">
                        <label>Hạn sử dụng (nếu có)</label>
                        <input type="date" th:field="*{lines[__${row.index}__].expiryDate}">
                    </div>
                </div>
                <div class="purchase-form-actions">
                    <button id="add-purchase-line" type="button" class="btn btn-primary">+ Thêm mặt hàng</button>
                    <button type="submit" class="btn btn-success">Tạo phiếu chờ nhận</button>
                </div>
            </form>
            <template id="purchase-line-template">
                <div class="purchase-line form-group">
                    <label>Mặt hàng</label>
                    <select name="lines[__index__].productId">
                        <option value="">-- Chọn mặt hàng --</option>
                        <option th:each="mh : ${matHangs}" th:value="${mh.maMatHang}" th:text="${mh.tenMatHang}"></option>
                    </select>
                    <label>Số lượng</label><input type="number" min="1" name="lines[__index__].quantity">
                    <label>Giá nhập mỗi sản phẩm</label><input type="number" min="0.01" step="0.01" name="lines[__index__].unitCost">
                    <label>Ngày sản xuất (nếu có)</label><input type="date" name="lines[__index__].manufactureDate">
                    <label>Hạn sử dụng (nếu có)</label><input type="date" name="lines[__index__].expiryDate">
                </div>
            </template>
            <script>
                const container = document.getElementById('purchase-lines');
                const template = document.getElementById('purchase-line-template');
                document.getElementById('add-purchase-line').addEventListener('click', () => {
                    const index = container.querySelectorAll('.purchase-line').length;
                    const line = template.content.cloneNode(true);
                    line.querySelectorAll('[name]').forEach((input) => {
                        input.name = input.name.replace('__index__', index);
                    });
                    container.appendChild(line);
                });
            </script>
        </section>
    </div>
</body>
</html>
