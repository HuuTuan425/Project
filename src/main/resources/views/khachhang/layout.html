<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <title th:text="${title}">Quản lý siêu thị</title>
    <!-- Nhớ là phải có file style.css ở thư mục static/css nhé -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:fragment="page(content)" class="app-layout">
        <aside class="menu">
            <div class="menu-brand" aria-label="Thương hiệu siêu thị">
                <span class="menu-brand-mark" aria-hidden="true">S</span>
                <span class="menu-brand-copy">
                    <strong>SIÊU THỊ</strong>
                    <small>QUẢN LÝ BÁN HÀNG</small>
                </span>
            </div>
            <nav class="menu-links" aria-label="Điều hướng chính">
                <a th:if="${isAdmin or isWarehouse or isPurchasing}" th:href="@{/mat-hang}"
                   th:classappend="${currentPath == '/mat-hang' or #strings.startsWith(currentPath, '/mat-hang/')} ? 'active' : ''"
                   th:attr="aria-current=${currentPath == '/mat-hang' or #strings.startsWith(currentPath, '/mat-hang/')} ? 'page' : null">
                    <span class="menu-icon" aria-hidden="true">▣</span>Quản lý mặt hàng
                </a>
                <a th:if="${isAdmin}" th:href="@{/khach-hang}"
                   th:classappend="${currentPath == '/khach-hang' or #strings.startsWith(currentPath, '/khach-hang/')} ? 'active' : ''"
                   th:attr="aria-current=${currentPath == '/khach-hang' or #strings.startsWith(currentPath, '/khach-hang/')} ? 'page' : null">
                    <span class="menu-icon" aria-hidden="true">♟</span>Quản lý khách hàng
                </a>
                <a th:if="${isCashier}" th:href="@{/khach-hang/them(from='sale')}"
                   th:classappend="${currentPath == '/khach-hang/them'} ? 'active' : ''"
                   th:attr="aria-current=${currentPath == '/khach-hang/them'} ? 'page' : null">
                    <span class="menu-icon" aria-hidden="true">♟</span>Thêm khách hàng
                </a>
                <a th:if="${isAdmin or isCashier}" th:href="@{/hoa-don/lap}"
                   th:classappend="${currentPath == '/hoa-don/lap'} ? 'active' : ''"
                   th:attr="aria-current=${currentPath == '/hoa-don/lap'} ? 'page' : null">
                    <span class="menu-icon" aria-hidden="true">🛒</span>Bán hàng
                </a>
                <a th:if="${isAdmin or isManager}" th:href="@{/hoa-don}"
                   th:classappend="${currentPath == '/hoa-don' or (#strings.startsWith(currentPath, '/hoa-don/') and currentPath != '/hoa-don/lap' and currentPath != '/hoa-don/bao-cao')} ? 'active' : ''"
                   th:attr="aria-current=${currentPath == '/hoa-don' or (#strings.startsWith(currentPath, '/hoa-don/') and currentPath != '/hoa-don/lap' and currentPath != '/hoa-don/bao-cao')} ? 'page' : null">
                    <span class="menu-icon" aria-hidden="true">▤</span>Lịch sử hóa đơn
                </a>
                <a th:if="${isAdmin or isManager}" th:href="@{/hoa-don/bao-cao}"
                   th:classappend="${currentPath == '/hoa-don/bao-cao'} ? 'active' : ''"
                   th:attr="aria-current=${currentPath == '/hoa-don/bao-cao'} ? 'page' : null">
                    <span class="menu-icon" aria-hidden="true">↗</span>Báo cáo doanh thu
                </a>
                <a th:if="${isAdmin or isWarehouse or isPurchasing or isManager}" th:href="@{/nhap-hang}"
                   th:classappend="${(currentPath == '/nhap-hang' or #strings.startsWith(currentPath, '/nhap-hang/')) and currentPath != '/nhap-hang/nha-cung-cap' and not #strings.startsWith(currentPath, '/nhap-hang/nha-cung-cap/')} ? 'active' : ''"
                   th:attr="aria-current=${(currentPath == '/nhap-hang' or #strings.startsWith(currentPath, '/nhap-hang/')) and currentPath != '/nhap-hang/nha-cung-cap' and not #strings.startsWith(currentPath, '/nhap-hang/nha-cung-cap/')} ? 'page' : null">
                    <span class="menu-icon" aria-hidden="true">⇧</span>Nhập kho
                </a>
                <a th:if="${isAdmin or isWarehouse or isPurchasing or isManager}"
                   th:href="@{/nhap-hang/nha-cung-cap}"
                   th:classappend="${currentPath == '/nhap-hang/nha-cung-cap' or #strings.startsWith(currentPath, '/nhap-hang/nha-cung-cap/')} ? 'active' : ''"
                   th:attr="aria-current=${currentPath == '/nhap-hang/nha-cung-cap' or #strings.startsWith(currentPath, '/nhap-hang/nha-cung-cap/')} ? 'page' : null">
                    <span class="menu-icon" aria-hidden="true">⌂</span>Nhà cung cấp
                </a>
                <a th:if="${isAdmin}" th:href="@{/tai-khoan}"
                   th:classappend="${currentPath == '/tai-khoan' or #strings.startsWith(currentPath, '/tai-khoan/')} ? 'active' : ''"
                   th:attr="aria-current=${currentPath == '/tai-khoan' or #strings.startsWith(currentPath, '/tai-khoan/')} ? 'page' : null">
                    <span class="menu-icon" aria-hidden="true">⚙</span>Tài khoản
                </a>
            </nav>
        </aside>
        <div class="app-shell">
            <header class="app-topbar">
                <div class="app-topbar-title"
                     th:text="${currentPath == '/hoa-don/lap' ? 'Lập hóa đơn' :
                              #strings.startsWith(currentPath, '/hoa-don/') ? 'Hóa đơn' :
                              #strings.startsWith(currentPath, '/khach-hang') ? 'Khách hàng' :
                              #strings.startsWith(currentPath, '/mat-hang') ? 'Mặt hàng' :
                              #strings.startsWith(currentPath, '/nhap-hang') ? 'Nhập kho' :
                               #strings.startsWith(currentPath, '/tai-khoan') ? 'Tài khoản' :
                               currentPath == '/hoa-don' ? 'Lịch sử hóa đơn' :
                               currentPath == '/hoa-don/bao-cao' ? 'Báo cáo doanh thu' : 'Tổng quan'}"></div>
                <div class="account-summary">
                    <strong th:text="${currentUsername}"></strong>
                    <span class="account-role" th:if="${isAdmin}">Quản trị viên</span>
                    <span class="account-role" th:if="${isCashier}">Nhân viên bán hàng</span>
                    <span class="account-role" th:if="${isWarehouse}">Thủ kho</span>
                    <span class="account-role" th:if="${isPurchasing}">Nhân viên mua hàng</span>
                    <span class="account-role" th:if="${isManager}">Quản lý cửa hàng</span>
                </div>
                <form th:action="@{/dang-xuat}" method="post">
                    <button type="submit" class="btn btn-outline-danger">Đăng xuất</button>
                </form>
            </header>
            <main class="app-main">
                <div class="container">
                    <div th:replace="${content}"></div>
                </div>
            </main>
        </div>
        <script>
            document.querySelectorAll('.message.success').forEach((message) => {
                message.classList.add('toast');
                message.setAttribute('role', 'status');
                message.setAttribute('aria-live', 'polite');
                window.setTimeout(() => {
                    message.classList.add('toast-hidden');
                    window.setTimeout(() => message.remove(), 300);
                }, 3000);
            });
        </script>
    </div>
</body>
</html>
