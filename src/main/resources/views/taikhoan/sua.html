<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{khachhang/layout :: head('Sửa hồ sơ tài khoản')}"></head>
<body>
    <div th:replace="~{khachhang/layout :: page(~{::section})}">
        <section>
            <h2>Sửa hồ sơ tài khoản</h2>
            <p>Tên đăng nhập: <strong th:text="${account.username}"></strong></p>
            <form th:action="@{/tai-khoan/{id}/sua(id=${account.id})}" th:object="${profileForm}" method="post">
                <div class="form-group">
                    <label for="fullName">Họ và tên nhân viên</label>
                    <input id="fullName" type="text" th:field="*{fullName}" maxlength="120" required>
                    <small class="field-error" th:errors="*{fullName}"></small>
                </div>
                <div class="form-group">
                    <label for="phone">Số điện thoại</label>
                    <input id="phone" type="tel" th:field="*{phone}" maxlength="30">
                    <small class="field-error" th:errors="*{phone}"></small>
                </div>
                <div class="form-group">
                    <label for="email">Email <span aria-hidden="true">*</span></label>
                    <input id="email" type="email" th:field="*{email}" maxlength="150" required>
                    <small class="field-error" th:errors="*{email}"></small>
                </div>
                <div class="form-group">
                    <label for="role">Loại tài khoản</label>
                    <select id="role" th:field="*{role}" required>
                        <option value="">-- Chọn loại tài khoản --</option>
                        <option th:each="role : ${roles}" th:value="${role}" th:text="${role.displayName}"></option>
                    </select>
                    <small class="field-error" th:errors="*{role}"></small>
                </div>
                <button type="submit" class="btn btn-success">Lưu thay đổi</button>
                <a th:href="@{/tai-khoan}" class="btn btn-primary">Hủy</a>
            </form>
        </section>
    </div>
</body>
</html>
