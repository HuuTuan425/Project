<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <title th:text="${title}">Quản lý siêu thị</title>
    <!-- Nhớ là phải có file style.css ở thư mục static/css nhé -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:fragment="page(content)" class="app-layout">
        <svg class="icon-sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <symbol id="icon-box" viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5 9-5Z"/><path d="M3 8v9l9 5 9-5V8M12 13v9"/></symbol>
            <symbol id="icon-users" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="10" cy="7" r="4"/><path d="M20 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></symbol>
            <symbol id="icon-cart" viewBox="0 0 24 24"><path d="M3 3h2l2.4 12.2a2 2 0 0 0 2 1.6h8.8a2 2 0 0 0 2-1.6L22 8H6"/><circle cx="10" cy="21" r="1"/><circle cx="18" cy="21" r="1"/></symbol>
            <symbol id="icon-receipt" viewBox="0 0 24 24"><path d="M4 3v18l4-2 4 2 4-2 4 2V3l-4 2-4-2-4 2-4-2Z"/><path d="M8 9h8M8 13h8"/></symbol>
            <symbol id="icon-chart" viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-5 5"/></symbol>
            <symbol id="icon-truck" viewBox="0 0 24 24"><path d="M3 6h12v12H3zM15 10h4l3 3v5h-7"/><circle cx="7.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></symbol>
            <symbol id="icon-building" viewBox="0 0 24 24"><path d="M3 21h18M5 21V5l7-3 7 3v16"/><path d="M9 9h1m4 0h1m-6 4h1m4 0h1m-5 8v-4h2v4"/></symbol>
            <symbol id="icon-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="m19.4 15 .1.1 1.4 1.1-1.4 2.4-1.7-.7a8 8 0 0 1-1.7 1l-.3 1.8h-2.8l-.3-1.8a8 8 0 0 1-1.7-1l-1.7.7-1.4-2.4 1.4-1.1a7 7 0 0 1 0-2l-1.4-1.1 1.4-2.4 1.7.7a8 8 0 0 1 1.7-1l.3-1.8h2.8l.3 1.8a8 8 0 0 1 1.7 1l1.7-.7 1.4 2.4-1.4 1.1a7 7 0 0 1-.1 1.9Z"/></symbol>
        </svg>
        <aside class="menu">
            <div class="menu-brand" aria-label="Thương hiệu siêu thị">
                <span class="menu-brand-mark" aria-hidden="true">
                    <svg viewBox="0 0 48 48" fill="none">
                        <path d="M8 19.5 11 11h26l3 8.5v3a5 5 0 0 1-5 5 5 5 0 0 1-5-5 5 5 0 0 1-10 0 5 5 0 0 1-5 5 5 5 0 0 1-5-5v-3Z" fill="currentColor" opacity=".22"/>
                        <path d="M8 19.5 11 11h26l3 8.5v3a5 5 0 0 1-5 5 5 5 0 0 1-5-5 5 5 0 0 1-10 0 5 5 0 0 1-5 5 5 5 0 0 1-5-5v-3Z" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
                        <path d="M12 28v11h24V28M19 39V29h10v10M16 17h16" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M23 7c1-3 4-4 7-4-1 3-3 5-7 5M24 8c-2-2-4-2-6-2 1 2 3 4 6 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </span>
                <span class="menu-brand-copy">
                    <strong>SIÊU THỊ</strong>
                    <small>QUẢN LÝ BÁN HÀNG</small>
                </span>
            </div>
            <nav class="menu-links" aria-label="Điều hướng chính">
                <a th:if="${isAdmin or isWarehouse or isPurchasing}" th:href="@{/mat-hang}"
                   th:classappend="${currentPath == '/mat-hang' or #strings.startsWith(currentPath, '/mat-hang/')} ? 'active' : ''"
                   th:attr="aria-current=${currentPath == '/mat-hang' or #strings.startsWith(currentPath, '/mat-hang/')} ? 'page' : null"><svg class="menu-icon" aria-hidden="true"><use href="#icon-box"></use></svg>Quản lý mặt hàng</a>
                <a th:if="${isAdmin}" th:href="@{/khach-hang}"
                   th:classappend="${currentPath == '/khach-hang' or #strings.startsWith(currentPath, '/khach-hang/')} ? 'active' : ''"
                   th:attr="aria-current=${currentPath == '/khach-hang' or #strings.startsWith(currentPath, '/khach-hang/')} ? 'page' : null"><svg class="menu-icon" aria-hidden="true"><use href="#icon-users"></use></svg>Quản lý khách hàng</a>
                <a th:if="${isCashier}" th:href="@{/khach-hang/them(from='sale')}"
                   th:classappend="${currentPath == '/khach-hang/them'} ? 'active' : ''"
                   th:attr="aria-current=${currentPath == '/khach-hang/them'} ? 'page' : null"><svg class="menu-icon" aria-hidden="true"><use href="#icon-users"></use></svg>Thêm khách hàng</a>
                <a th:if="${isAdmin or isCashier}" th:href="@{/hoa-don/lap}"
                   th:classappend="${currentPath == '/hoa-don/lap'} ? 'active' : ''"
                   th:attr="aria-current=${currentPath == '/hoa-don/lap'} ? 'page' : null"><svg class="menu-icon" aria-hidden="true"><use href="#icon-cart"></use></svg>Bán hàng</a>
                <a th:if="${isAdmin or isManager}" th:href="@{/hoa-don}"
                   th:classappend="${currentPath == '/hoa-don' or (#strings.startsWith(currentPath, '/hoa-don/') and currentPath != '/hoa-don/lap' and currentPath != '/hoa-don/bao-cao')} ? 'active' : ''"
                   th:attr="aria-current=${currentPath == '/hoa-don' or (#strings.startsWith(currentPath, '/hoa-don/') and currentPath != '/hoa-don/lap' and currentPath != '/hoa-don/bao-cao')} ? 'page' : null"><svg class="menu-icon" aria-hidden="true"><use href="#icon-receipt"></use></svg>Lịch sử hóa đơn</a>
                <a th:if="${isAdmin or isManager}" th:href="@{/hoa-don/bao-cao}"
                   th:classappend="${currentPath == '/hoa-don/bao-cao'} ? 'active' : ''"
                   th:attr="aria-current=${currentPath == '/hoa-don/bao-cao'} ? 'page' : null"><svg class="menu-icon" aria-hidden="true"><use href="#icon-chart"></use></svg>Báo cáo doanh thu</a>
                <a th:if="${isAdmin or isWarehouse or isPurchasing or isManager}" th:href="@{/nhap-hang}"
                   th:classappend="${(currentPath == '/nhap-hang' or #strings.startsWith(currentPath, '/nhap-hang/')) and currentPath != '/nhap-hang/nha-cung-cap' and not #strings.startsWith(currentPath, '/nhap-hang/nha-cung-cap/')} ? 'active' : ''"
                   th:attr="aria-current=${(currentPath == '/nhap-hang' or #strings.startsWith(currentPath, '/nhap-hang/')) and currentPath != '/nhap-hang/nha-cung-cap' and not #strings.startsWith(currentPath, '/nhap-hang/nha-cung-cap/')} ? 'page' : null"><svg class="menu-icon" aria-hidden="true"><use href="#icon-truck"></use></svg>Nhập kho</a>
                <a th:if="${isAdmin or isWarehouse or isPurchasing or isManager}"
                   th:href="@{/nhap-hang/nha-cung-cap}"
                   th:classappend="${currentPath == '/nhap-hang/nha-cung-cap' or #strings.startsWith(currentPath, '/nhap-hang/nha-cung-cap/')} ? 'active' : ''"
                   th:attr="aria-current=${currentPath == '/nhap-hang/nha-cung-cap' or #strings.startsWith(currentPath, '/nhap-hang/nha-cung-cap/')} ? 'page' : null"><svg class="menu-icon" aria-hidden="true"><use href="#icon-building"></use></svg>Nhà cung cấp</a>
                <a th:if="${isAdmin}" th:href="@{/tai-khoan}"
                   th:classappend="${currentPath == '/tai-khoan' or #strings.startsWith(currentPath, '/tai-khoan/')} ? 'active' : ''"
                   th:attr="aria-current=${currentPath == '/tai-khoan' or #strings.startsWith(currentPath, '/tai-khoan/')} ? 'page' : null"><svg class="menu-icon" aria-hidden="true"><use href="#icon-settings"></use></svg>Tài khoản</a>
            </nav>
        </aside>
        <div class="app-shell">
            <header class="app-topbar">
                <div class="app-topbar-title"
                     th:text="${currentPath == '/hoa-don/lap' ? 'Lập hóa đơn' :
                              #strings.startsWith(currentPath, '/hoa-don/') ? 'Hóa đơn' :
                              #strings.startsWith(currentPath, '/khach-hang') ? 'Khách hàng' :
                              #strings.startsWith(currentPath, '/mat-hang') ? 'Mặt hàng' :
                              #strings.startsWith(currentPath, '/nhap-hang') ? 'Nhập kho' :
                               #strings.startsWith(currentPath, '/tai-khoan') ? 'Tài khoản' :
                               currentPath == '/hoa-don' ? 'Lịch sử hóa đơn' :
                               currentPath == '/hoa-don/bao-cao' ? 'Báo cáo doanh thu' : 'Tổng quan'}"></div>
                <div class="account-summary">
                    <strong th:text="${currentUsername}"></strong>
                    <span class="account-role" th:if="${isAdmin}">Quản trị viên</span>
                    <span class="account-role" th:if="${isCashier}">Nhân viên bán hàng</span>
                    <span class="account-role" th:if="${isWarehouse}">Thủ kho</span>
                    <span class="account-role" th:if="${isPurchasing}">Nhân viên mua hàng</span>
                    <span class="account-role" th:if="${isManager}">Quản lý cửa hàng</span>
                </div>
                <form th:action="@{/logout}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button type="submit" class="btn btn-outline-danger">Đăng xuất</button>
                </form>
            </header>
            <main class="app-main">
                <div class="container">
                    <div th:replace="${content}"></div>
                </div>
            </main>
        </div>
        <script>
            document.querySelectorAll('.message.success').forEach((message) => {
                message.classList.add('toast');
                message.setAttribute('role', 'status');
                message.setAttribute('aria-live', 'polite');
                window.setTimeout(() => {
                    message.classList.add('toast-hidden');
                    window.setTimeout(() => message.remove(), 300);
                }, 3000);
            });
        </script>
    </div>
</body>
</html>
