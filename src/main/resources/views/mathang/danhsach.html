<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{khachhang/layout :: head('Quản lý mặt hàng')}"></head>
<body>
    <div th:replace="~{khachhang/layout :: page(~{::section})}">
        <section>
            <div class="page-heading">
                <div>
                    <h1>Quản lý mặt hàng</h1>
                    <p class="list-count" th:text="${'Hiển thị ' + totalMatHang + ' mặt hàng'}"></p>
                </div>
                <a th:if="${isAdmin}" th:href="@{/mat-hang/them}" class="btn btn-success">＋ Thêm mặt hàng</a>
            </div>
            <p th:if="${successMessage}" class="message success" th:text="${successMessage}"></p>
            <p th:if="${errorMessage}" class="message error" th:text="${errorMessage}"></p>
            <form th:action="@{/mat-hang}" method="get" class="customer-filter product-filter">
                <div>
                    <label for="product-search">Tìm kiếm mặt hàng</label>
                    <input id="product-search" type="search" name="q" th:value="${q}"
                           placeholder="Tìm theo mã, tên mặt hàng hoặc hãng sản xuất...">
                </div>
                <button type="submit" class="btn btn-primary">Tìm kiếm</button>
                <a th:if="${not #strings.isEmpty(q)}" th:href="@{/mat-hang}"
                   class="btn btn-secondary">Xóa bộ lọc</a>
            </form>

            <div th:if="${#lists.isEmpty(dsMatHang)}" class="invoice-no-results" role="status" aria-live="polite">
                <strong th:if="${#strings.isEmpty(q)}">Chưa có mặt hàng nào.</strong>
                <strong th:if="${not #strings.isEmpty(q)}">
                    Không tìm thấy mặt hàng phù hợp với từ khóa “<span th:text="${q}"></span>”.
                </strong>
                <span th:if="${not #strings.isEmpty(q)}">Hãy kiểm tra mã mặt hàng, tên hoặc hãng sản xuất rồi thử lại.</span>
            </div>

            <div th:if="${not #lists.isEmpty(dsMatHang)}" class="customer-table-scroll">
                <table class="customer-table product-table align-middle">
                    <thead>
                        <tr>
                            <th class="text-center" scope="col">Mã</th>
                            <th scope="col">Tên mặt hàng</th>
                            <th scope="col">Loại</th>
                            <th scope="col">Hãng sản xuất</th>
                            <th class="text-center" scope="col">Giá gốc</th>
                            <th class="text-center" scope="col">Giá khuyến mãi</th>
                            <th class="text-center" scope="col">Số lượng tồn</th>
                            <th class="text-center" scope="col">Trạng thái</th>
                            <th class="text-center" scope="col">Thao tác</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="mh : ${dsMatHang}">
                            <td class="text-center" th:text="${mh.maMatHang}"></td>
                            <td th:text="${mh.tenMatHang}"></td>
                            <td th:text="${mh.loaiMatHang.displayName}"></td>
                            <td th:text="${#strings.isEmpty(mh.hangSanXuat) ? '-' : mh.hangSanXuat}"></td>
                            <td class="text-center"
                                th:text="${#numbers.formatDecimal(mh.giaBanGoc, 0, 'COMMA', 0, 'POINT') + ' đ'}"></td>
                            <td class="text-center"
                                th:text="${mh.giaKhuyenMai != null ? #numbers.formatDecimal(mh.giaKhuyenMai, 0, 'COMMA', 0, 'POINT') + ' đ' : '-'}"></td>
                            <td class="text-center" th:text="${mh.quantityInStock}"></td>
                            <td class="text-center">
                                <span th:class="${mh.conHang ? 'invoice-badge is-paid' : 'invoice-badge is-cancelled'}"
                                      th:text="${mh.trangThaiHienThi}"></span>
                            </td>
                            <td class="text-center">
                                <div class="customer-actions">
                                    <a th:if="${isAdmin}" th:href="@{/mat-hang/sua/{id}(id=${mh.maMatHang})}"
                                       class="btn btn-sm btn-outline-primary">
                                        <span aria-hidden="true">✏️</span> Sửa
                                    </a>
                                    <form th:if="${isAdmin}" th:action="@{/mat-hang/xoa/{id}(id=${mh.maMatHang})}"
                                          method="post" class="product-delete-form">
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                        <button type="submit" class="btn btn-sm btn-outline-danger"
                                                onclick="return confirm('Bạn có chắc muốn xóa mặt hàng này?')">
                                            <span aria-hidden="true">🗑️</span> Xóa
                                        </button>
                                    </form>
                                    <span th:if="${isWarehouse or isPurchasing}" class="account-role">Chỉ xem</span>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </div>
</body>
</html>
